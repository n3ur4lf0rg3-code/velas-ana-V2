<!doctype html><html><head><style>
html,body{margin:0;padding:0;background:#888}
.row{display:flex;gap:16px;padding:16px;align-items:flex-end}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;font:12px sans-serif;color:#fff}
img{display:block;image-rendering:auto}
.tile16{width:16px;height:16px}
.tile32{width:32px;height:32px}
.tile64{width:64px;height:64px}
</style></head><body>
<div class="row">
  <div class="cell"><img class="tile16" src="/favicon.svg"><span>16</span></div>
  <div class="cell"><img class="tile32" src="/favicon.svg"><span>32</span></div>
  <div class="cell"><img class="tile64" src="/favicon.svg"><span>64</span></div>
</div>
</body></html>
